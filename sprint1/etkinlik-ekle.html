<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
    <nav aria-label="Ana Menü">
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="etkinlik-adi">Etkinlik Adı</label><br>
        <input type="text" id="etkinlik-adi" name="etkinlik-adi" required>
      </p>

      <p>
        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
        </select>
      </p>

      <p>
        <label for="tarih">Tarih</label><br>
        <input type="date" id="tarih" name="tarih" placeholder="gg.aa.yyyy" required>
      </p>

      <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="4" cols="40"></textarea>
      </p>

      <p>
        <button type="submit">Kaydet</button>
      </p>
    </form>
  </main>

  <footer>
    <p>Alp Avcu — 21210327744 · 2026</p>
  </footer>

</body>
</html>
