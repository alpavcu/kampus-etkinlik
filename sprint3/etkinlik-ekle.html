<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/numaran.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
    <nav aria-label="Ana Menü">
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <div class="form-kapsayici">
      <p class="form-bilgi">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

      <form id="etkinlik-formu" novalidate>
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad">
          <span id="ad-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
          </select>
          <span id="kategori-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih">
          <span id="tarih-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat">
          <span id="saat-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
          <span id="yer-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="kontenjan">Kontenjan</label>
          <input type="number" id="kontenjan" name="kontenjan" placeholder="1–1000 arası">
          <span id="kontenjan-hata" class="hata-mesaj"></span>
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="4"></textarea>
          <span id="aciklama-hata" class="hata-mesaj"></span>
        </div>

        <div>
          <button type="submit" class="buton-birincil">Kaydet</button>
        </div>

        <div id="form-mesaj"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>Alp Avcu — 21210327744 · 2026</p>
  </footer>

</body>
</html>
